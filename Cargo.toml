[package]
name = "tracon"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Terminal approach control for coding agents"
license = "BSD-3-Clause"
repository = "https://github.com/kallisti-dev/tracon"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
